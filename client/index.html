<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>魔塔 · Tower of Doom</title>
    <style>
      :root {
        --game-width: 384px;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: #14121a;
        color: #f2ecf9;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        min-height: 100%;
        overflow-x: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      #lobby {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        gap: 16px;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        width: 100%;
        text-align: center;
      }
      #lobby h1 { font-size: clamp(1.4rem, 6vw, 2rem); margin: 0; }
      #lobby p { color: #b4a9c9; margin: 0; font-size: clamp(0.85rem, 3.2vw, 1rem); }
      #nameInput {
        padding: 10px 14px;
        font-size: 1rem;
        border-radius: 8px;
        border: 1px solid #4a3f63;
        background: #211c2e;
        color: #f2ecf9;
        width: min(220px, 100%);
      }
      #joinBtn {
        padding: 10px 24px;
        font-size: 1rem;
        border-radius: 8px;
        border: none;
        background: #8338ec;
        color: white;
        cursor: pointer;
      }
      #joinBtn:hover:not(:disabled) { background: #9d5cf5; }
      #joinBtn:disabled { background: #4a3f63; cursor: not-allowed; }
      #charSelect {
        display: flex;
        gap: 14px;
      }
      .charCard {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: clamp(76px, 24vw, 96px);
        padding: 10px 8px;
        border-radius: 12px;
        border: 2px solid #4a3f63;
        background: #211c2e;
        color: #f2ecf9;
        cursor: pointer;
      }
      .charCard:hover { border-color: #9d5cf5; }
      .charCard.selected { border-color: #ffbe0b; background: #2b2438; }
      .charCard .charIcon {
        width: clamp(44px, 16vw, 56px);
        height: clamp(44px, 16vw, 56px);
      }
      .charCard .charIcon svg { width: 100%; height: 100%; display: block; }
      .charCard span { font-size: 0.9rem; }
      #status { color: #e63946; min-height: 1.2em; font-size: 0.9rem; }
      #app {
        display: none;
        flex-direction: column;
        align-items: center;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        gap: 8px;
      }
      #hud {
        display: flex;
        gap: 12px;
        padding: 8px 12px;
        background: #211c2e;
        width: min(var(--game-width), 92vw);
        box-sizing: border-box;
        font-size: clamp(0.75rem, 2.8vw, 0.95rem);
        flex-wrap: wrap;
        justify-content: center;
        border-radius: 8px;
      }
      #hud span b { color: #ffbe0b; }
      #gameContainer {
        width: min(var(--game-width), 92vw);
        aspect-ratio: 1 / 1;
        line-height: 0;
      }
      #gameContainer canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      #log {
        width: min(var(--game-width), 92vw);
        max-height: 90px;
        overflow-y: auto;
        background: #1a1626;
        padding: 6px 12px;
        box-sizing: border-box;
        font-size: 0.8rem;
        color: #cbb;
        border-radius: 8px;
      }
      #dpad {
        display: none;
        grid-template-columns: repeat(3, 56px);
        grid-template-rows: repeat(3, 56px);
        gap: 6px;
        margin: 4px 0;
        touch-action: none;
      }
      #dpad button {
        border: 1px solid #4a3f63;
        background: #211c2e;
        color: #f2ecf9;
        font-size: 1.4rem;
        border-radius: 10px;
        touch-action: none;
        user-select: none;
      }
      #dpad button:active { background: #8338ec; }
      #dpadUp { grid-column: 2; grid-row: 1; }
      #dpadLeft { grid-column: 1; grid-row: 2; }
      #dpadRight { grid-column: 3; grid-row: 2; }
      #dpadDown { grid-column: 2; grid-row: 3; }
      @media (pointer: coarse) {
        #dpad { display: grid; }
      }
      #errorBanner {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9999;
        background: #b3261e;
        color: white;
        font-size: 0.8rem;
        padding: 6px 10px;
        word-break: break-word;
        max-height: 40vh;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div id="errorBanner"></div>
    <div id="lobby">
      <h1>魔塔 · Tower of Doom</h1>
      <p>输入你的名字，选择角色，与好友（共1-2人）合作攀登同一座塔</p>
      <input id="nameInput" maxlength="16" placeholder="玩家的名字" />
      <div id="charSelect">
        <button type="button" class="charCard" data-character="princess">
          <div class="charIcon" id="iconPrincess"></div>
          <span>公主</span>
        </button>
        <button type="button" class="charCard" data-character="warrior">
          <div class="charIcon" id="iconWarrior"></div>
          <span>勇士</span>
        </button>
      </div>
      <button id="joinBtn" disabled>加入游戏</button>
      <div id="status"></div>
    </div>
    <div id="app">
      <div id="hud"></div>
      <div id="gameContainer"></div>
      <div id="dpad">
        <button id="dpadUp">▲</button>
        <button id="dpadLeft">◀</button>
        <button id="dpadRight">▶</button>
        <button id="dpadDown">▼</button>
      </div>
      <div id="log"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
